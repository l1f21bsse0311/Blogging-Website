name: wf-pr-validation

on:
  pull_request:
    branches:
      - develop
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4
      - name: Lint HTML and CSS Files
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"

  build-job:
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: Try build
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./"
